<div class="history-container">
  <h2>Transaction History</h2>

  <div class="summary">
    <p>Total Helmets Rented: {{ totalHelmetsRented }}</p>
    <p>Total Amount Spent: ₹{{ totalAmountSpent }}</p>
  </div>

  <mat-table [dataSource]="transactionHistory">
    <!-- Helmet ID Column -->
    <ng-container matColumnDef="helmetId">
      <mat-header-cell *matHeaderCellDef> Helmet ID </mat-header-cell>
      <mat-cell *matCellDef="let txn"> {{ txn.helmetId }} </mat-cell>
    </ng-container>

    <!-- Duration Column -->
    <ng-container matColumnDef="duration">
      <mat-header-cell *matHeaderCellDef> Duration (min) </mat-header-cell>
      <mat-cell *matCellDef="let txn"> {{ txn.duration }} </mat-cell>
    </ng-container>

    <!-- Cost Column -->
    <ng-container matColumnDef="cost">
      <mat-header-cell *matHeaderCellDef> Cost (₹) </mat-header-cell>
      <mat-cell *matCellDef="let txn"> {{ txn.cost }} </mat-cell>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
      <mat-cell *matCellDef="let txn"> {{ txn.date }} </mat-cell>
    </ng-container>

    <!-- Header and Rows -->
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
